    {

<body class="bg-slate-100 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Search, Plus, Edit2, Trash2, Building2, User, Phone, MapPin, 
      Calendar, FileText, Check, X, AlertCircle, Lock, Unlock, Key, 
      Hash, Download, Star, RefreshCw, Layers, CheckCircle2, Clock,
      UserPlus, LogIn, LogOut, ShieldCheck, Users, UserCheck, UserX,
      Paperclip, Image, FileSpreadsheet, Upload, Eye, Share2, Copy, Globe, Smartphone
    } from 'lucide-react';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, serverTimestamp, getDocs } from 'firebase/firestore';

    // 1. Storage Keys (v6로 업그레이드하여 이전 더미 회원 및 26개 샘플 고객 자동 초기화)
    const STORAGE_KEY_RECORDS = 'ent_iptv_records_v6';
    const STORAGE_KEY_MEMBERS = 'ent_iptv_members_v6';
    const STORAGE_KEY_SESSION = 'ent_iptv_session_v6';
    const STORAGE_KEY_FB_CONFIG = 'ent_iptv_fb_config_v6';
    const STORAGE_KEY_DELETED_MEMS = 'ent_iptv_deleted_members_v6';
    const STORAGE_KEY_DELETED_RECS = 'ent_iptv_deleted_records_v6';

    // 스마트폰(Android/iOS) ⇄ PC 간 100% 실시간 동기화를 위한 다중 클라우드 채널
    const SYNC_CHANNEL_TOPIC = 'ent2103/iptv/sync/v6/state';
    const SYNC_PING_TOPIC = 'ent2103/iptv/sync/v6/ping';
    const MQTT_BROKERS = [
      'wss://broker.emqx.io:8084/mqtt',
      'wss://broker.hivemq.com:8884/mqtt'
    ];
    const REST_KV_URL = 'https://kvdb.io/6Wa9pQ2mK8vX3nL5rT1yB/ent2103_iptv_v6_master';

    // 삭제된 회원/레코드가 다시 살아나지 않도록 삭제 이력 관리
    const getDeletedMemberSet = () => {
      try {
        return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY_DELETED_MEMS) || '[]'));
      } catch (e) {
        return new Set();
      }
    };
    const addDeletedMemberKey = (username) => {
      if (!username) return;
      const set = getDeletedMemberSet();
      set.add(String(username).trim().toLowerCase());
      try { localStorage.setItem(STORAGE_KEY_DELETED_MEMS, JSON.stringify(Array.from(set))); } catch (e) {}
    };
    const removeDeletedMemberKey = (username) => {
      if (!username) return;
      const set = getDeletedMemberSet();
      set.delete(String(username).trim().toLowerCase());
      try { localStorage.setItem(STORAGE_KEY_DELETED_MEMS, JSON.stringify(Array.from(set))); } catch (e) {}
    };

    // 여러 기기 데이터를 합칠 때 스마트폰에서 신청한 신규 회원이나 수정된 회원 정보가 절대 덮어써지지 않도록 스마트 병합
    const mergeMembersList = (localList = [], remoteList = [], deletedKeys = []) => {
      const delSet = new Set([
        ...Array.from(getDeletedMemberSet()),
        ...(Array.isArray(deletedKeys) ? deletedKeys.map(k => String(k).toLowerCase()) : [])
      ]);
      const map = new Map();
      [...INITIAL_MEMBERS, ...localList, ...remoteList].forEach((m) => {
        if (!m || !m.username) return;
        const key = String(m.username).trim().toLowerCase();
        if (key !== 'ent2103' && delSet.has(key)) return;
        const existing = map.get(key);
        if (!existing) {
          map.set(key, { ...m, username: String(m.username).trim() });
        } else {
          const existingTime = Number(existing.updatedAtMs || 0);
          const incomingTime = Number(m.updatedAtMs || 0);
          if (incomingTime >= existingTime) {
            map.set(key, { ...existing, ...m, username: String(m.username).trim() });
          }
        }
      });
      return Array.from(map.values());
    };

    const mergeRecordsList = (localList = [], remoteList = []) => {
      if (!remoteList || remoteList.length === 0) return localList;
      const map = new Map();
      [...localList, ...remoteList].forEach((r) => {
        if (!r) return;
        const key = String(r.id || `seq_${r.seq}`);
        const existing = map.get(key);
        if (!existing) {
          map.set(key, r);
        } else {
          const existingTime = Number(existing.updatedAtMs || 0);
          const incomingTime = Number(r.updatedAtMs || 0);
          if (incomingTime >= existingTime) {
            map.set(key, { ...existing, ...r });
          }
        }
      });
      return Array.from(map.values()).sort((a, b) => (Number(a.seq) || 9999) - (Number(b.seq) || 9999));
    };

    const getSavedFirebaseConfig = () => {
      try {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          const parsed = JSON.parse(__firebase_config);
          if (parsed && parsed.apiKey) return parsed;
        }
        const saved = localStorage.getItem(STORAGE_KEY_FB_CONFIG);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.apiKey) return parsed;
        }
      } catch (e) {
        console.warn("Config load error:", e);
      }
      return {};
    };

    const rawFirebaseConfig = getSavedFirebaseConfig();
    const hasCloudFirebase = Boolean(rawFirebaseConfig && rawFirebaseConfig.apiKey);
    let app = null;
    let auth = null;
    let db = null;
    if (hasCloudFirebase) {
      try {
        app = initializeApp(rawFirebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      } catch (e) {
        console.warn("Firebase init fallback:", e);
      }
    }
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    // 담당 직원(구분) 목록 및 업체명 목록
    const STAFF_LIST = ['박국용', '박정훈', '오세웅', '서진섭', '김경민', '이근', '하형준', '손민아'];
    const COMPANY_LIST = ['(주)이앤티', '㈜온파워아이앤티'];
    const WORK_TYPE_LIST = ['단체형IPTV'];
    const REMARKS_STATUS_LIST = ['개통예정', '개통완료', '정산완료', '보류', '취소'];
    const BASE_UNIT_PRICE = 35000;
    const DIFFICULT_EXTRA_PRICE = 10000;

    // 고객명 '강서K병원' 1건만 남기고 나머지 샘플 고객은 모두 삭제
    const INITIAL_DATA = [
      { id: 'rec_1', seq: 1, staffName: '박국용', subNumber: '500-2404-1001', company: '(주)이앤티', workType: '단체형IPTV', unitPrice: 35000, isDifficult: false, branch: '디컴스', manager: '이대운', contact: '010-6776-5602', customer: '강서K병원', address: '서울 강서구 화곡동 377-8', lines: 19, scheduledDate: '2024-04-24', remarks: '정산완료', extraNote: '', isHighlighted: false, attachments: [], updatedAtMs: 1713916800000 }
    ];

    // 최고관리자(ent2103)를 제외한 나머지 샘플 회원 및 승인요청 회원 전체 삭제
    const INITIAL_MEMBERS = [
      { id: 'mem_admin', username: 'ent2103', password: 'ronaldono9!@', name: '대표님(총괄관리자)', department: '대표이사', phone: '010-0000-0000', role: 'admin', status: 'approved', requestedAt: '2024-04-01', updatedAtMs: 1711929600000 }
    ];

    const DEFAULT_FORM = {
      seq: '',
      staffName: '박국용',
      subNumber: '',
      company: '(주)이앤티',
      workType: '단체형IPTV',
      unitPrice: BASE_UNIT_PRICE,
      isDifficult: false,
      branch: '',
      manager: '',
      contact: '',
      customer: '',
      address: '',
      lines: '',
      scheduledDate: '',
      remarks: '정산완료',
      extraNote: '',
      isHighlighted: false,
      attachments: []
    };

    function App() {
      const [user, setUser] = useState(hasCloudFirebase ? null : { uid: 'standalone-user' });
      const [records, setRecords] = useState(() => {
        if (hasCloudFirebase) return [];
        try {
          const saved = localStorage.getItem(STORAGE_KEY_RECORDS);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_DATA;
      });
      const [members, setMembers] = useState(() => {
        if (hasCloudFirebase) return [];
        try {
          const saved = localStorage.getItem(STORAGE_KEY_MEMBERS);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return mergeMembersList(parsed, []);
          }
        } catch (e) {}
        return INITIAL_MEMBERS;
      });
      const [loading, setLoading] = useState(hasCloudFirebase);
      
      // 처음 도메인 접속 시 로그인 창이 나오고, 로그인 후 새로고침(F5) 시에는 로그아웃되지 않도록 sessionStorage 사용
      const [currentMember, setCurrentMember] = useState(() => {
        try {
          const savedSession = sessionStorage.getItem(STORAGE_KEY_SESSION);
          if (savedSession) {
            const parsed = JSON.parse(savedSession);
            if (parsed && parsed.username) return parsed;
          }
        } catch (e) {}
        return null;
      });
      const [authTab, setAuthTab] = useState('LOGIN');
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [signupForm, setSignupForm] = useState({
        username: '',
        password: '',
        name: '',
        department: '구내공사 시공팀',
        phone: ''
      });
      const [authNotice, setAuthNotice] = useState({ type: '', message: '' });
      const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);

      // UI & Filter States
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [companyFilter, setCompanyFilter] = useState('ALL');
      const [staffFilter, setStaffFilter] = useState('ALL');
      const [monthFilter, setMonthFilter] = useState('ALL');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [resetConfirmOpen, setResetConfirmOpen] = useState(false);
      const tableSectionRef = useRef(null);

      // Attachment Management States
      const [attachmentModalRecordId, setAttachmentModalRecordId] = useState(null);
      const [attachmentNotice, setAttachmentNotice] = useState({ type: '', message: '' });
      const [uploadingFile, setUploadingFile] = useState(false);
      const [previewAttachment, setPreviewAttachment] = useState(null);

      // Share & Cloud DB Config Modal State
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [copySuccess, setCopySuccess] = useState(false);
      const [fbConfigInput, setFbConfigInput] = useState(() => localStorage.getItem(STORAGE_KEY_FB_CONFIG) || '');
      const [fbConfigNotice, setFbConfigNotice] = useState('');
      
      // Form State
      const [formData, setFormData] = useState(DEFAULT_FORM);
      const [editingId, setEditingId] = useState(null);

      // Masking States
      const [isMasked, setIsMasked] = useState(true);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState('');
      const [lastSyncedAt, setLastSyncedAt] = useState('');
      const [syncStatus, setSyncStatus] = useState('모바일·PC 실시간 브릿지 연결중...');

      // 회원 정보 직접 수정 & 관리자 직접 회원 등록 상태
      const [editingMemberId, setEditingMemberId] = useState(null);
      const [editMemberForm, setEditMemberForm] = useState({
        name: '',
        username: '',
        password: '',
        department: '',
        phone: '',
        role: 'member',
        status: 'approved'
      });
      const [newMemberDirectForm, setNewMemberDirectForm] = useState({
        username: '',
        password: '1234',
        name: '',
        department: '구내공사 시공팀',
        phone: '',
        role: 'member'
      });
      const [showAddMemberRow, setShowAddMemberRow] = useState(false);
      const [memberManageNotice, setMemberManageNotice] = useState('');

      // 최신 상태 참조용 Ref & MQTT 클라이언트 Ref
      const membersRefState = useRef(members);
      const recordsRefState = useRef(records);
      const mqttClientsRef = useRef([]);
      useEffect(() => { membersRefState.current = members; }, [members]);
      useEffect(() => { recordsRefState.current = records; }, [records]);

      // 로그인 상태 변경 시 sessionStorage에 저장 (새로고침 F5 시에도 로그아웃되지 않고 유지됨)
      useEffect(() => {
        try {
          if (currentMember) {
            sessionStorage.setItem(STORAGE_KEY_SESSION, JSON.stringify(currentMember));
          } else {
            sessionStorage.removeItem(STORAGE_KEY_SESSION);
          }
        } catch (e) {}
      }, [currentMember]);

      // --- 공용 클라우드 실시간 동기화 헬퍼 (안드로이드·iOS ⇄ PC 100% 양방향 병합 동기화) ---
      const saveMembersToLocal = (list) => {
        try {
          localStorage.setItem(STORAGE_KEY_MEMBERS, JSON.stringify(list));
        } catch (e) {}
      };

      const saveRecordsToLocal = (list) => {
        try {
          localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(list));
        } catch (e) {}
      };

      // MQTT 실시간 브로커로 현재 상태를 브로드캐스트 (Retain 옵션 적용으로 나중에 켠 기기도 즉시 수신)
      const broadcastViaMqtt = (recordsList, membersList) => {
        const lightRecords = (recordsList || []).map(r => ({
          ...r,
          attachments: (r.attachments || []).slice(0, 2)
        }));
        const messageStr = JSON.stringify({
          updatedAt: Date.now(),
          members: membersList || [],
          records: lightRecords,
          deletedMembers: Array.from(getDeletedMemberSet())
        });

        let sent = false;
        mqttClientsRef.current.forEach((client) => {
          try {
            if (client && client.connected) {
              client.publish(SYNC_CHANNEL_TOPIC, messageStr, { qos: 1, retain: true });
              sent = true;
            }
          } catch (e) {}
        });
        return sent;
      };

      const pushSharedState = async (nextRecords, nextMembers) => {
        const rList = nextRecords || recordsRefState.current;
        const mList = nextMembers || membersRefState.current;
        saveRecordsToLocal(rList);
        saveMembersToLocal(mList);

        if (hasCloudFirebase) return { records: rList, members: mList };

        let mergedMembers = mList;
        let mergedRecords = rList;

        // 1) 안드로이드 / iOS / PC 즉시 동기화: MQTT Retained 메시지 즉시 발송
        const mqttSent = broadcastViaMqtt(mergedRecords, mergedMembers);

        // 2) 백업 REST 클라우드 스토리지 병합 및 저장
        try {
          const checkRes = await fetch(`${REST_KV_URL}?t=${Date.now()}`, { cache: 'no-store' });
          if (checkRes.ok) {
            const remoteData = await checkRes.json();
            if (remoteData && Array.isArray(remoteData.members)) {
              mergedMembers = mergeMembersList(mergedMembers, remoteData.members, remoteData.deletedMembers);
            }
            if (remoteData && Array.isArray(remoteData.records)) {
              mergedRecords = mergeRecordsList(mergedRecords, remoteData.records);
            }
          }
        } catch (e) {}

        saveMembersToLocal(mergedMembers);
        saveRecordsToLocal(mergedRecords);
        setMembers(mergedMembers);
        setRecords(mergedRecords);

        // 병합된 최종본을 다시 한번 MQTT Retain + REST 서버에 저장
        broadcastViaMqtt(mergedRecords, mergedMembers);

        let restOk = false;
        try {
          const res = await fetch(REST_KV_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              updatedAt: Date.now(),
              records: mergedRecords,
              members: mergedMembers,
              deletedMembers: Array.from(getDeletedMemberSet())
            })
          });
          if (res.ok) restOk = true;
        } catch (e) {}

        setLastSyncedAt(new Date().toLocaleTimeString('ko-KR'));
        setSyncStatus((mqttSent || restOk) ? '스마트폰·PC 실시간 연동중' : '기기 로컬 저장됨');
        return { records: mergedRecords, members: mergedMembers };
      };

      const pullSharedState = async () => {
        let currentMembers = membersRefState.current;
        let currentRecords = recordsRefState.current;
        try {
          const localMem = JSON.parse(localStorage.getItem(STORAGE_KEY_MEMBERS) || '[]');
          if (Array.isArray(localMem) && localMem.length > 0) {
            currentMembers = mergeMembersList(currentMembers, localMem);
          }
        } catch (e) {}

        if (hasCloudFirebase) return { members: currentMembers, records: currentRecords };

        // 다른 연결된 기기들에게 최신 상태 요청 핑 발송
        mqttClientsRef.current.forEach((client) => {
          try {
            if (client && client.connected) {
              client.publish(SYNC_PING_TOPIC, JSON.stringify({ ts: Date.now() }));
            }
          } catch (e) {}
        });

        try {
          const res = await fetch(`${REST_KV_URL}?t=${Date.now()}`, { cache: 'no-store' });
          if (res.ok) {
            const remoteData = await res.json();
            if (remoteData) {
              if (Array.isArray(remoteData.members) && remoteData.members.length > 0) {
                currentMembers = mergeMembersList(currentMembers, remoteData.members, remoteData.deletedMembers);
                saveMembersToLocal(currentMembers);
                setMembers(currentMembers);
              }
              if (Array.isArray(remoteData.records) && remoteData.records.length > 0) {
                currentRecords = mergeRecordsList(currentRecords, remoteData.records);
                saveRecordsToLocal(currentRecords);
                setRecords(currentRecords);
              }
              setLastSyncedAt(new Date().toLocaleTimeString('ko-KR'));
              setSyncStatus('스마트폰·PC 실시간 연동중');
            }
          }
        } catch (e) {}

        return { members: currentMembers, records: currentRecords };
      };

      // --- Status Classification Helpers ---
      const isCompletedRecord = (r) => (r.remarks || '').trim() === '정산완료';
      const isCanceledRecord = (r) => {
        const rem = (r.remarks || '').trim();
        return rem.includes('취소') || rem.includes('보류');
      };
      const isInProgressRecord = (r) => !isCompletedRecord(r) && !isCanceledRecord(r);

      const getRemarksBadgeStyle = (remarksText) => {
        const rem = (remarksText || '').trim();
        if (rem === '정산완료') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
        if (rem === '개통완료') return 'bg-blue-100 text-blue-800 border-blue-300';
        if (rem === '개통예정') return 'bg-indigo-100 text-indigo-800 border-indigo-300';
        if (rem === '보류') return 'bg-amber-100 text-amber-800 border-amber-300';
        if (rem === '취소') return 'bg-red-100 text-red-700 border-red-300';
        return 'bg-slate-100 text-slate-700 border-slate-300';
      };

      const getEffectiveUnitPrice = (r) => {
        const base = Number(r.unitPrice) || BASE_UNIT_PRICE;
        const extra = r.isDifficult ? DIFFICULT_EXTRA_PRICE : 0;
        return base + extra;
      };

      const getRecordTotalPrice = (r) => (Number(r.lines) || 0) * getEffectiveUnitPrice(r);

      const getRecordMonthKey = (scheduledDate) => {
        const str = String(scheduledDate || '').trim();
        const match = str.match(/^(\d{4})-(\d{2})/);
        if (match) return `${match[1]}-${match[2]}`;
        return 'UNDECIDED';
      };

      const formatMonthLabel = (monthKey) => {
        if (monthKey === 'UNDECIDED') return '일정미정/기타';
        const [year, month] = monthKey.split('-');
        return `${year}년 ${Number(month)}월`;
      };

      // --- Masking Helper Functions ---
      const maskSubNumber = (subNo) => {
        if (!subNo) return '-';
        const str = String(subNo).trim();
        if (str.includes('-')) {
          const parts = str.split('-');
          if (parts.length >= 3) return `${parts[0]}-****-${parts[parts.length - 1]}`;
          if (parts.length === 2) return `${parts[0]}-****`;
        }
        if (str.length >= 7) return str.substring(0, 3) + '****' + str.substring(str.length - 3);
        return '****';
      };

      const maskPhone = (phone) => {
        if (!phone) return '-';
        const str = String(phone).trim();
        const parts = str.split('-');
        if (parts.length === 3) return `${parts[0]}-****-${parts[2]}`;
        if (str.length > 7) return str.substring(0, 3) + '-****-' + str.substring(str.length - 4);
        return '****';
      };

      const maskAddress = (address) => {
        if (!address) return '-';
        const str = String(address).trim();

      // 안드로이드·아이폰(iOS)·PC 실시간 양방향 MQTT 브로커 연결 + 주기적 동기화
      useEffect(() => {
        if (hasCloudFirebase) return;
        pullSharedState();

        const clients = [];
        if (window.mqtt && typeof window.mqtt.connect === 'function') {
          MQTT_BROKERS.forEach((brokerUrl) => {
            try {
              const client = window.mqtt.connect(brokerUrl, {
                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 3000,
                clientId: 'ent2103_' + Math.random().toString(16).substring(2, 10)
              });

              client.on('connect', () => {
                setSyncStatus('스마트폰·PC 실시간 연동중');
                setLastSyncedAt(new Date().toLocaleTimeString('ko-KR'));
                client.subscribe([SYNC_CHANNEL_TOPIC, SYNC_PING_TOPIC], { qos: 1 });
                // 접속 즉시 다른 기기들에게 최신 상태 요청
                client.publish(SYNC_PING_TOPIC, JSON.stringify({ ts: Date.now() }));
              });

              client.on('message', (topic, payloadBuffer) => {
                try {
                  const text = payloadBuffer.toString();
                  if (!text) return;
                  const data = JSON.parse(text);

                  if (topic === SYNC_PING_TOPIC) {
                    // 다른 기기(또는 스마트폰/PC)가 접속해서 최신 상태를 요청하면 내 상태를 공유
                    const curMems = membersRefState.current;
                    const curRecs = recordsRefState.current;
                    if (curMems.length > 1 || curRecs.length > 1) {
                      const msg = JSON.stringify({
                        updatedAt: Date.now(),
                        members: curMems,
                        records: curRecs.map(r => ({ ...r, attachments: (r.attachments || []).slice(0, 2) })),
                        deletedMembers: Array.from(getDeletedMemberSet())
                      });
                      client.publish(SYNC_CHANNEL_TOPIC, msg, { qos: 1, retain: true });
                    }
                    return;
                  }

                  if (topic === SYNC_CHANNEL_TOPIC && data) {
                    if (Array.isArray(data. deletedMembers)) {
                      data.deletedMembers.forEach(k => addDeletedMemberKey(k));
                    }
                    if (Array.isArray(data.members) && data.members.length > 0) {
                      setMembers(prev => {
                        const merged = mergeMembersList(prev, data.members, data.deletedMembers);
                        saveMembersToLocal(merged);
                        return merged;
                      });
                    }
                    if (Array.isArray(data.records) && data.records.length > 0) {
                      setRecords(prev => {
                        const merged = mergeRecordsList(prev, data.records);
                        saveRecordsToLocal(merged);
                        return merged;
                      });
                    }
                    setLastSyncedAt(new Date().toLocaleTimeString('ko-KR'));
                    setSyncStatus('스마트폰·PC 실시간 연동중');
                  }
                } catch (err) {}
              });

              clients.push(client);
            } catch (err) {}
          });
          mqttClientsRef.current = clients;
        }

        const timer = setInterval(() => {
          pullSharedState();
        }, 4000);

        return () => {
          clearInterval(timer);
          clients.forEach(c => {
            try { c.end(true); } catch (e) {}
          });
        };
      }, []);

      // 타 브라우저 탭 간 실시간 동기화 지원

          if (e.key === STORAGE_KEY_MEMBERS && e.newValue) {

      // 클라우드 DB(Firebase) 설정값 저장 핸들러
      const handleSaveFirebaseConfig = () => {
        try {
          const raw = fbConfigInput.trim();
          if (!raw) {
            localStorage.removeItem(STORAGE_KEY_FB_CONFIG);
            window.location.reload();
            return;
          }
          // firebaseConfig = { ... } 형태나 순수 JSON 형태 모두 자동 파싱 지원
          const jsonMatch = raw.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('올바른 설정 형식이 아닙니다.');
          const normalized = jsonMatch[0]
            .replace(/(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '"$2":')
            .replace(/'/g, '"');
          const parsed = JSON.parse(normalized);
          if (!parsed.apiKey || !parsed.projectId) {
            throw new Error('apiKey와 projectId가 포함되어야 합니다.');
          }
          localStorage.setItem(STORAGE_KEY_FB_CONFIG, JSON.stringify(parsed));
          setFbConfigNotice('클라우드 DB 연결 설정이 저장되었습니다. 페이지를 새로고침합니다...');
          setTimeout(() => window.location.reload(), 800);

        const seedAndListen = async () => {

              for (const d of snapRecords.docs) {

                  await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'iptv_records', d.id));
                }

            }

            const snapMembers = await getDocs(membersRef);

                const { id, ...adminData } = INITIAL_MEMBERS[0];
                await addDoc(membersRef, { ...adminData, createdAt: serverTimestamp() });
              }
            }

            unsubRecords = onSnapshot(recordsRef, 
              (snapshot) => {
                const fetchedRecords = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
                fetchedRecords.sort((a, b) => (Number(a.seq) || 9999) - (Number(b.seq) || 9999));
                setRecords(fetchedRecords);
                setLoading(false);
              },
              (error) => {

              }

            unsubMembers = onSnapshot(membersRef,
              (snapshot) => {
                setMembers(snapshot.docs.map((d) => ({ id: d.id, ...d.data() })));
              },
              (error) => console.error("Firestore members error:", error)
            );
          } catch (err) {
            console.error("Setup error:", err);
            setLoading(false);
          }
        };

        seedAndListen();
        return () => {
          if (unsubRecords) unsubRecords();

        };

      const detectAttachmentCategory = (file) => {
        const name = (file.name || '').toLowerCase();
        const type = (file.type || '').toLowerCase();
        if (type.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp)$/.test(name)) return 'IMAGE';
        if (name.endsWith('.pdf') || type === 'application/pdf') return 'PDF';
        if (/\.(xlsx|xls|csv)$/.test(name) || type.includes('spreadsheet') || type.includes('excel') || type.includes('csv')) return 'EXCEL';
        return 'OTHER';

      const formatFileSize = (bytes) => {
        const num = Number(bytes) || 0;
        if (num < 1024) return `${num} B`;
        if (num < 1024 * 1024) return `${(num / 1024).toFixed(1)} KB`;
        return `${(num / (1024 * 1024)).toFixed(2)} MB`;
      };

      const convertFileToAttachmentItem = (file) => {
        return new Promise((resolve, reject) => {
          const category = detectAttachmentCategory(file);
          if (category === 'OTHER') {
            reject(new Error(`지원하지 않는 파일 형식입니다 (${file.name}). 사진, 엑셀, PDF만 첨부 가능합니다.`));
            return;
          }
          if (category === 'IMAGE') {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const img = new window.Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_DIM = 1200;
                let width = img.width;
                let height = img.height;
                if (width > height && width > MAX_DIM) { height = Math.round((height * MAX_DIM) / width); width = MAX_DIM; }
                else if (height > MAX_DIM) { width = Math.round((width * MAX_DIM) / height); height = MAX_DIM; }
                canvas.width = width;
                canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.78);
                resolve({
                  id: `att_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                  name: file.name,
                  category: 'IMAGE',
                  mimeType: 'image/jpeg',
                  size: Math.round((compressedDataUrl.length * 3) / 4),
                  dataUrl: compressedDataUrl,
                  uploadedAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
                  uploadedBy: currentMember?.name || '관리자'
                });
              };
              img.onerror = () => reject(new Error('이미지 로드 오류'));
              img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
          } else {
            if (file.size > 650 * 1024) {
              reject(new Error(`[${file.name}] 파일 크기는 650KB 이하로 첨부해주세요.`));
              return;
            }
            const reader = new FileReader();
            reader.onload = (ev) => {
              resolve({
                id: `att_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                name: file.name,
                category,
                mimeType: file.type || 'application/octet-stream',
                size: file.size,
                dataUrl: ev.target.result,
                uploadedAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
                uploadedBy: currentMember?.name || '관리자'
              });
            };
            reader.readAsDataURL(file);
          }
        });

                                    <>
                                      <button
                                        type="button"
                                        onClick={() => handleSaveEditMember(m)}
                                        className="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-bold shadow-sm"
                                      >
                                        저장
                                      </button>
                                      <button
                                        type="button"
                                        onClick={() => setEditingMemberId(null)}
                                        className="px-2.5 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded text-xs font-bold"
                                      >
                                        취소
                                      </button>
                                    </>
                                  ) : (
                                    <>
                                      <button
                                        type="button"
                                        onClick={() => handleStartEditMember(m)}
                                        className="px-2.5 py-1 bg-slate-100 hover:bg-blue-50 text-blue-700 border border-blue-200 rounded text-xs font-bold flex items-center gap-1"
                                        title="연락처, 이름, 소속, 비밀번호 수정"
                                      >
                                        <Edit2 className="w-3 h-3" /> 정보수정
                                      </button>

                                      {m.username !== 'ent2103' && (
                                        <>
                                          {m.status !== 'approved' && (
                                            <>
                                              <button
                                                type="button"
                                                onClick={() => handleUpdateMemberStatus(m.id || m.username, 'approved', 'member')}
                                                className="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-bold"
                                              >
                                                일반 승인
                                              </button>
                                              <button
                                                type="button"
                                                onClick={() => handleUpdateMemberStatus(m.id || m.username, 'approved', 'admin')}
                                                className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-bold"
                                              >
                                                관리자 승인
                                              </button>
                                            </>
                                          )}
                                          {m.status !== 'rejected' && (
                                            <button
                                              type="button"
                                              onClick={() => handleUpdateMemberStatus(m.id || m.username, 'rejected')}
                                              className="px-2 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded text-xs font-bold"
                                            >
                                              {m.status === 'approved' ? '승인취소' : '반려'}
                                            </button>
                                          )}
                                          <button
                                            type="button"
                                            onClick={() => handleDeleteMember(m.id, m.username)}
                                            className="px-2 py-1 text-slate-400 hover:text-red-600 text-xs font-bold"
                                          >
                                            삭제
                                          </button>
                                        </>
                                      )}
                                    </>
                                  )}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="px-6 py-3 bg-slate-50 border-t border-slate-200 flex flex-wrap justify-between items-center gap-2 text-xs text-slate-500">
                  <span>💡 각 회원의 <strong>[정보수정]</strong> 버튼을 누르면 연락처, 이름, 소속, 비밀번호를 바로 변경할 수 있습니다.</span>
                  <span className="text-slate-400 font-mono">동기화 상태: {syncStatus} {lastSyncedAt && `(${lastSyncedAt})`}</span>
                </div>
              </div>
            </div>
          )}

          {/* Attachment Management Modal */}
          {activeAttachmentRecord && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden my-8">
                <div className="px-6 py-4 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="text-base font-bold">[{activeAttachmentRecord.customer}] 첨부자료 관리 (사진·엑셀·PDF)</h3>
                  <button onClick={() => { setAttachmentModalRecordId(null); setPreviewAttachment(null); }}><X className="w-5 h-5" /></button>
                </div>
                <div className="p-6 space-y-4">
                  {attachmentNotice.message && (
                    <div className={`p-3 rounded-lg text-xs font-bold ${attachmentNotice.type === 'error' ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'}`}>
                      {attachmentNotice.message}
                    </div>
                  )}
                  <label className="cursor-pointer block p-4 border-2 border-dashed border-blue-300 rounded-xl bg-blue-50/40 text-center hover:bg-blue-50">
                    <span className="text-sm font-bold text-blue-800">+ 클릭하여 사진(JPG/PNG), 엑셀(XLSX/CSV), PDF 파일 첨부하기</span>
                    <input type="file" multiple accept="image/*,.xlsx,.xls,.csv,.pdf" onChange={(e) => handleDirectRecordAttachmentUpload(e, activeAttachmentRecord)} className="hidden" />
                  </label>
                  <div className="space-y-2">
                    {(activeAttachmentRecord.attachments || []).map(att => (
                      <div key={att.id} className="flex items-center justify-between p-3 border rounded-lg bg-slate-50 text-xs">
                        <span className="font-bold truncate">{att.name} ({formatFileSize(att.size)})</span>
                        <div className="flex items-center gap-2">
                          <button onClick={() => handleDownloadAttachment(att)} className="px-2.5 py-1 bg-blue-600 text-white rounded font-bold">다운로드</button>
                          <button onClick={() => handleDeleteRecordAttachment(activeAttachmentRecord, att.id)} className="px-2 py-1 text-red-600 font-bold">삭제</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Share & Cloud DB Connect Modal */}
          {isShareModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden my-8">
                <div className="px-6 py-4 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="text-base font-bold">데이터 영구저장 상태 및 클라우드 실시간 연동 설정</h3>
                  <button onClick={() => setIsShareModalOpen(false)}><X className="w-5 h-5" /></button>
                </div>
                <div className="p-6 space-y-4 text-xs sm:text-sm text-slate-700">
                  <div className={`p-3.5 rounded-xl border ${hasCloudFirebase ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-blue-50 border-blue-200 text-blue-900'}`}>
                    <div className="font-extrabold mb-1">
                      {hasCloudFirebase ? '✅ 현재 상태: 구글 클라우드(Firebase) 실시간 DB 연동 중' : '💾 현재 상태: 브라우저 자동 영구저장(LocalStorage) 작동 중'}
                    </div>
                    <p className="text-xs leading-relaxed">
                      {hasCloudFirebase
                        ? '모든 직원의 PC·스마트폰에서 회원가입 및 수정 내역이 실시간으로 동기화됩니다.'
                        : '이제 새로고침(F5)을 눌러도 회원가입, 승인, 수정 내역이 초기화되지 않고 영구 보존됩니다! 다른 기기(직원 폰)와 실시간 공유하려면 아래에 Firebase 설정값을 붙여넣어 주세요.'}
                    </p>
                  </div>

                  <div className="space-y-2 pt-2 border-t border-slate-200">
                    <label className="block font-extrabold text-slate-800">
                      ☁️ 전 직원 기기 간 실시간 DB 연동하기 (선택사항)
                    </label>
                    <p className="text-xs text-slate-500 leading-relaxed">
                      Firebase 콘솔에서 발급받은 <code className="bg-slate-100 px-1 rounded">firebaseConfig</code> 값을 아래에 붙여넣고 저장하면 모든 기기가 실시간 연동됩니다.
                    </p>
                    <textarea
                      rows="4"
                      placeholder={'{\n  "apiKey": "AIzaSy...",\n  "projectId": "ent-iptv...",\n  "appId": "1:..."\n}'}
                      value={fbConfigInput}
                      onChange={(e) => setFbConfigInput(e.target.value)}
                      className="w-full p-2.5 text-xs font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                    {fbConfigNotice && (
                      <p className="text-xs font-bold text-blue-600">{fbConfigNotice}</p>
                    )}
                    <button
                      type="button"
                      onClick={handleSaveFirebaseConfig}
                      className="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg text-xs"
                    >
                      클라우드 DB 설정값 저장 및 적용
                    </button>
                  </div>

                  <div className="pt-2 border-t border-slate-200">
                    <button onClick={handleCopyShareNotice} className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg">
                      {copySuccess ? '복사 완료!' : '직원 단톡방 공지문구 복사하기'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

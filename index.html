          }
        }
      });
      return Array.from(map.values());
    };

      [...localList, ...remoteList].forEach((r) => {
        if (!r) return;
        const key = String(r.id || `seq_${r.seq}`);
        const existing = map.get(key);
        if (!existing) {

      // --- Attachment Helpers ---
      const detectAttachmentCategory = (file) => {
        const name = (file.name || '').toLowerCase();
        const type = (file.type || '').toLowerCase();
        if (type.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp)$/.test(name)) return 'IMAGE';
        if (name.endsWith('.pdf') || type === 'application/pdf') return 'PDF';
        if (/\.(xlsx|xls|csv)$/.test(name) || type.includes('spreadsheet') || type.includes('excel') || type.includes('csv')) return 'EXCEL';
        return 'OTHER';
      };

      const formatFileSize = (bytes) => {
        const num = Number(bytes) || 0;
        if (num < 1024) return `${num} B`;
        if (num < 1024 * 1024) return `${(num / 1024).toFixed(1)} KB`;
        return `${(num / (1024 * 1024)).toFixed(2)} MB`;
      };

      const convertFileToAttachmentItem = (file) => {
        return new Promise((resolve, reject) => {
          const category = detectAttachmentCategory(file);
          if (category === 'OTHER') {
            reject(new Error(`지원하지 않는 파일 형식입니다 (${file.name}). 사진, 엑셀, PDF만 첨부 가능합니다.`));
            return;
          }
          if (category === 'IMAGE') {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const img = new window.Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_DIM = 1200;
                let width = img.width;
                let height = img.height;
                if (width > height && width > MAX_DIM) { height = Math.round((height * MAX_DIM) / width); width = MAX_DIM; }
                else if (height > MAX_DIM) { width = Math.round((width * MAX_DIM) / height); height = MAX_DIM; }
                canvas.width = width;
                canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.78);
                resolve({
                  id: `att_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                  name: file.name,
                  category: 'IMAGE',
                  mimeType: 'image/jpeg',
                  size: Math.round((compressedDataUrl.length * 3) / 4),
                  dataUrl: compressedDataUrl,
                  uploadedAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
                  uploadedBy: currentMember?.name || '관리자'
                });
              };
              img.onerror = () => reject(new Error('이미지 로드 오류'));
              img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
          } else {
            if (file.size > 650 * 1024) {
              reject(new Error(`[${file.name}] 파일 크기는 650KB 이하로 첨부해주세요.`));
              return;
            }
            const reader = new FileReader();
            reader.onload = (ev) => {
              resolve({
                id: `att_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                name: file.name,
                category,
                mimeType: file.type || 'application/octet-stream',
                size: file.size,
                dataUrl: ev.target.result,
                uploadedAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
                uploadedBy: currentMember?.name || '관리자'
              });
            };
            reader.readAsDataURL(file);
          }
        });

        setUploadingFile(true);
        setAttachmentNotice({ type: '', message: '' });
        try {
          const existingList = Array.isArray(record.attachments) ? [...record.attachments] : [];
          const newItems = [];
          for (const file of files) {
            newItems.push(await convertFileToAttachmentItem(file));
          }
          const updatedList = [...existingList, ...newItems];
          await updateRecordHelper(record.id, { attachments: updatedList });
          setAttachmentNotice({ type: 'success', message: `${newItems.length}개의 파일이 첨부되었습니다.` });
        } catch (err) {
          setAttachmentNotice({ type: 'error', message: err.message || '파일 첨부 오류' });

          setUploadingFile(false);
        }

                                                일반 승인

                                              <button
                                                type="button"

                </div>
              </div>

                        : '이제 새로고침(F5)을 눌러도 회원가입, 승인, 수정 내역이 초기화되지 않고 영구 보존됩니다! 다른 기기(직원 폰)와 실시간 공유하려면 아래에 Firebase 설정값을 붙여넣어 주세요.'}

                  </div>

                  <div className="space-y-2 pt-2 border-t border-slate-200">
                    <label className="block font-extrabold text-slate-800">

                    <p className="text-xs text-slate-500 leading-relaxed">

                    </p>
                    <textarea
                      rows="4"
                      placeholder={'{\n  "apiKey": "AIzaSy...",\n  "projectId": "ent-iptv...",\n  "appId": "1:..."\n}'}

                      onChange={(e) => setFbConfigInput(e.target.value)}

                    />

                      <p className="text-xs font-bold text-blue-600">{fbConfigNotice}</p>
                    )}
                    <button
                      type="button"
                      onClick={handleSaveFirebaseConfig}
                      className="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg text-xs"
                    >
                      클라우드 DB 설정값 저장 및 적용
                    </button>
                  </div>

                  <div className="pt-2 border-t border-slate-200">
                    <button onClick={handleCopyShareNotice} className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg">
                      {copySuccess ? '복사 완료!' : '직원 단톡방 공지문구 복사하기'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

      Paperclip: (p) => <Icon {...p} path={<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>} />,

      History: (p) => <Icon {...p} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></>} />
    };

    const STAFF_LIST = ['박국용', '박정훈', '오세웅', '서진섭', '김경민', '이근', '하형준', '손민아'];
    const COMPANY_LIST = ['(주)이앤티', '㈜온파워아이앤티'];
    const WORK_TYPE_LIST = ['단체형IPTV'];
    const REMARKS_STATUS_LIST = ['개통예정', '개통완료', '정산완료', '보류', '취소'];
    const BASE_UNIT_PRICE = 35000;
    const DIFFICULT_EXTRA_PRICE = 10000;

    // 강서K병원 1건만 유지
    const INITIAL_DATA = [
      { id: 'rec_1', seq: 1, staffName: '박국용', subNumber: '500-2404-1001', company: '(주)이앤티', workType: '단체형IPTV', unitPrice: 35000, isDifficult: false, branch: '디컴스', manager: '이대운', contact: '010-6776-5602', customer: '강서K병원', address: '서울 강서구 화곡동 377-8', lines: 19, scheduledDate: '2024-04-24', remarks: '정산완료', extraNote: '', isHighlighted: false, attachments: [] }
    ];

    // 최고관리자 1명만 유지
    const INITIAL_MEMBERS = [
      { id: 'mem_admin', username: 'ent2103', password: 'ronaldono9!@', name: '대표님(총괄관리자)', department: '대표이사', phone: '010-0000-0000', role: 'admin', status: 'approved', requestedAt: '2024-04-01' }
    ];

    const INITIAL_NOTICES = [
      { id: 'notice_1', title: '[공지] (주)이앤티 단체형IPTV 구내공사 전산 시스템 안내', content: '본인 담당 구내공사 내역 확인 및 현장 시공 사진, 엑셀 정산서, PDF 서류를 첨부해 주시기 바랍니다.', author: '대표님(총괄관리자)', createdAt: '2024-09-01', isImportant: true }
    ];

    const STORAGE_KEY_RECORDS = 'ent_iptv_records_v7';
    const STORAGE_KEY_MEMBERS = 'ent_iptv_members_v7';
    const STORAGE_KEY_NOTICES = 'ent_iptv_notices_v7';
    const STORAGE_KEY_AUDIT_LOGS = 'ent_iptv_audit_logs_v7';
    const SESSION_KEY_AUTH_USER = 'ent_iptv_session_user_v7';
    const MQTT_TOPIC_SYNC = 'ent_iptv_cloud_sync_v7/state';

    const DEFAULT_FORM = {
      seq: '',
      staffName: '박국용',
      subNumber: '',
      company: '(주)이앤티',
      workType: '단체형IPTV',
      unitPrice: BASE_UNIT_PRICE,
      isDifficult: false,
      branch: '',
      manager: '',
      contact: '',
      customer: '',
      address: '',
      lines: '',
      scheduledDate: '',
      remarks: '정산완료',
      extraNote: '',
      isHighlighted: false,
      attachments: []
    };

    function App() {
      const [records, setRecords] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_RECORDS);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return INITIAL_DATA;
      });

      const [members, setMembers] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_MEMBERS);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_MEMBERS;
      });

      const [notices, setNotices] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_NOTICES);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return INITIAL_NOTICES;
      });

      const [auditLogs, setAuditLogs] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_AUDIT_LOGS);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return [];
      });

      // 새로고침(F5) 시 로그인 상태 유지 (sessionStorage 활용)
      const [currentMember, setCurrentMember] = useState(() => {
        try {
          const savedSession = sessionStorage.getItem(SESSION_KEY_AUTH_USER);
          if (savedSession) return JSON.parse(savedSession);
        } catch (e) {}
        return null;
      });

      const [authTab, setAuthTab] = useState('LOGIN');
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [signupForm, setSignupForm] = useState({ username: '', password: '', name: '', department: '구내공사 시공팀', phone: '' });
      const [authNotice, setAuthNotice] = useState({ type: '', message: '' });

      // 모달 및 필터 상태
      const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
      const [editingMember, setEditingMember] = useState(null);
      const [newMemberFormOpen, setNewMemberFormOpen] = useState(false);
      const [newMemberForm, setNewMemberForm] = useState({ username: '', password: '', name: '', department: '구내공사 시공팀', phone: '', role: 'member' });

      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [companyFilter, setCompanyFilter] = useState('ALL');
      const [staffFilter, setStaffFilter] = useState('ALL');
      const [monthFilter, setMonthFilter] = useState('ALL');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [formData, setFormData] = useState(DEFAULT_FORM);
      const [editingId, setEditingId] = useState(null);

      // 다중 선택 체크박스 & 삭제 암호 확인 상태
      const [selectedIds, setSelectedIds] = useState([]);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [bulkDeleteConfirmOpen, setBulkDeleteConfirmOpen] = useState(false);
      const [deletePasswordInput, setDeletePasswordInput] = useState('');
      const [deletePasswordError, setDeletePasswordError] = useState('');

      // 고객명 클릭 상세정보 모달
      const [detailRecord, setDetailRecord] = useState(null);

      // 공지사항 관리 모달
      const [isNoticeModalOpen, setIsNoticeModalOpen] = useState(false);
      const [editingNotice, setEditingNotice] = useState(null);
      const [noticeForm, setNoticeForm] = useState({ title: '', content: '', isImportant: true });
      const [viewingNotice, setViewingNotice] = useState(null);

      // 작업 로그 기록 모달
      const [isAuditModalOpen, setIsAuditModalOpen] = useState(false);
      const [auditFilterType, setAuditFilterType] = useState('ALL');

      // 첨부파일 모달
      const [attachmentModalRecordId, setAttachmentModalRecordId] = useState(null);
      const [uploadingFile, setUploadingFile] = useState(false);
      const [previewAttachment, setPreviewAttachment] = useState(null);

      // 마스킹 상태
      const [isMasked, setIsMasked] = useState(true);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState('');

      // 모바일(Android/iOS) & PC 뷰 전환 상태 ('AUTO' | 'CARD' | 'TABLE')
      const [viewMode, setViewMode] = useState('AUTO');

      const mqttClientRef = useRef(null);

      // 로컬 스토리지 동기화
      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records)); } catch (e) {}
      }, [records]);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY_MEMBERS, JSON.stringify(members)); } catch (e) {}
      }, [members]);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY_NOTICES, JSON.stringify(notices)); } catch (e) {}
      }, [notices]);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY_AUDIT_LOGS, JSON.stringify(auditLogs)); } catch (e) {}
      }, [auditLogs]);

      useEffect(() => {
        try {
          if (currentMember) {
            sessionStorage.setItem(SESSION_KEY_AUTH_USER, JSON.stringify(currentMember));
          } else {
            sessionStorage.removeItem(SESSION_KEY_AUTH_USER);
          }
        } catch (e) {}
      }, [currentMember]);

      // 실시간 모바일/PC 클라우드 브릿지 (MQTT over WSS)
      const broadcastCloudState = (nextRecords, nextMembers, nextNotices, nextLogs) => {
        if (mqttClientRef.current && mqttClientRef.current.connected) {
          try {
            const payload = JSON.stringify({
              records: nextRecords,
              members: nextMembers,
              notices: nextNotices,
              auditLogs: nextLogs,
              ts: Date.now()
            });
            mqttClientRef.current.publish(MQTT_TOPIC_SYNC, payload, { qos: 1, retain: true });
          } catch (e) {}
        }
      };

      useEffect(() => {
        if (typeof window.mqtt === 'undefined') return;
        try {
          const client = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'ent_iptv_' + Math.random().toString(16).slice(2, 10),
            clean: true,
            reconnectPeriod: 3000
          });
          mqttClientRef.current = client;

          client.on('connect', () => {
            client.subscribe(MQTT_TOPIC_SYNC, { qos: 1 });
          });

          client.on('message', (topic, message) => {
            if (topic !== MQTT_TOPIC_SYNC) return;
            try {
              const data = JSON.parse(message.toString());
              if (Array.isArray(data.members)) {
                setMembers(prev => {
                  const map = new Map();
                  prev.forEach(m => map.set(m.username, m));
                  data.members.forEach(m => map.set(m.username, m));
                  return Array.from(map.values());
                });
              }
              if (Array.isArray(data.records)) setRecords(data.records);
              if (Array.isArray(data.notices)) setNotices(data.notices);
              if (Array.isArray(data.auditLogs)) setAuditLogs(data.auditLogs);
            } catch (e) {}
          });

          return () => {
            client.end(true);
          };
        } catch (e) {}
      }, []);

      // 작업자 로그 기록 추가 함수
      const addAuditLog = (actionType, targetCustomer, detailMessage, actorOverride = null) => {
        const actor = actorOverride || currentMember;
        const newLog = {
          id: 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          timestamp: new Date().toLocaleString('ko-KR', { hour12: false }),
          actorName: actor?.name || '미확인',
          actorId: actor?.username || '-',
          actorRole: actor?.role === 'admin' ? '최고관리자' : '일반직원',
          actionType, // '등록' | '수정' | '삭제' | '공지' | '회원관리'
          targetCustomer: targetCustomer || '-',
          detail: detailMessage
        };
        const updatedLogs = [newLog, ...auditLogs].slice(0, 300);
        setAuditLogs(updatedLogs);
        return updatedLogs;
      };

      const isAdmin = currentMember?.role === 'admin';

      const getCleanMemberName = (rawName) => {
        if (!rawName) return '';
        return String(rawName).trim().split(' ')[0];
      };

      const isOwnedByCurrentMember = (record) => {
        if (!currentMember) return false;
        if (currentMember.role === 'admin') return true;
        const cleanName = getCleanMemberName(currentMember.name);
        return record.staffName === cleanName || record.manager === cleanName || record.createdBy === currentMember.username;
      };

      const accessibleRecords = useMemo(() => {
        if (!currentMember) return [];
        if (isAdmin) return records;
        return records.filter(isOwnedByCurrentMember);
      }, [records, currentMember, isAdmin]);

      const getEffectiveUnitPrice = (r) => (Number(r.unitPrice) || BASE_UNIT_PRICE) + (r.isDifficult ? DIFFICULT_EXTRA_PRICE : 0);
      const getRecordTotalPrice = (r) => (Number(r.lines) || 0) * getEffectiveUnitPrice(r);

      const getRecordMonthKey = (scheduledDate) => {
        const match = String(scheduledDate || '').trim().match(/^(\d{4})-(\d{2})/);
        return match ? `${match[1]}-${match[2]}` : 'UNDECIDED';
      };

      const formatMonthLabel = (monthKey) => {
        if (monthKey === 'UNDECIDED') return '일정미정/기타';
        const [y, m] = monthKey.split('-');
        return `${y}년 ${Number(m)}월`;
      };

      const getRemarksBadgeStyle = (rem) => {
        const r = (rem || '').trim();
        if (r === '정산완료') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
        if (r === '개통완료') return 'bg-blue-100 text-blue-800 border-blue-300';
        if (r === '개통예정') return 'bg-indigo-100 text-indigo-800 border-indigo-300';
        if (r === '보류') return 'bg-amber-100 text-amber-800 border-amber-300';
        if (r === '취소') return 'bg-red-100 text-red-700 border-red-300';
        return 'bg-slate-100 text-slate-700 border-slate-300';
      };

      // 마스킹 헬퍼
      const maskSubNumber = (s) => {
        if (!s) return '-';
        const parts = String(s).split('-');
        return parts.length >= 3 ? `${parts[0]}-****-${parts[parts.length - 1]}` : '****';
      };
      const maskPhone = (p) => {
        if (!p) return '-';
        const parts = String(p).split('-');
        return parts.length === 3 ? `${parts[0]}-****-${parts[2]}` : '****';
      };
      const maskAddress = (a) => {
        if (!a) return '-';
        const parts = String(a).trim().split(' ');
        return parts.length > 2 ? `${parts[0]} ${parts[1]} ****` : `${parts[0]} ****`;
      };

      // 필터링된 레코드
      const filteredRecords = useMemo(() => {
        return accessibleRecords.filter(r => {
          const rem = (r.remarks || '').trim();
          const matchesStatus =
            statusFilter === 'ALL' ? true :
            statusFilter === 'COMPLETED' ? rem === '정산완료' :
            statusFilter === 'IN_PROGRESS' ? (rem !== '정산완료' && !rem.includes('취소') && !rem.includes('보류')) :
            statusFilter === 'CANCELED' ? (rem.includes('취소') || rem.includes('보류')) :
            statusFilter === 'HIGHLIGHTED' ? Boolean(r.isHighlighted) :
            REMARKS_STATUS_LIST.includes(statusFilter) ? rem === statusFilter : true;
          if (!matchesStatus) return false;
          if (companyFilter !== 'ALL' && (r.company || '').trim() !== companyFilter) return false;
          if (isAdmin && staffFilter !== 'ALL' && (r.staffName || '').trim() !== staffFilter) return false;
          if (monthFilter !== 'ALL' && getRecordMonthKey(r.scheduledDate) !== monthFilter) return false;
          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();
          return (
            (r.customer && r.customer.toLowerCase().includes(q)) ||
            (r.manager && r.manager.toLowerCase().includes(q)) ||
            (r.branch && r.branch.toLowerCase().includes(q)) ||
            (r.staffName && r.staffName.toLowerCase().includes(q)) ||
            (r.subNumber && r.subNumber.toLowerCase().includes(q)) ||
            (r.address && r.address.toLowerCase().includes(q))
          );
        });
      }, [accessibleRecords, statusFilter, companyFilter, staffFilter, monthFilter, searchQuery, isAdmin]);

      // 대시보드 통계
      const summary = useMemo(() => {
        const totalCount = accessibleRecords.length;
        const totalLines = accessibleRecords.reduce((a, c) => a + (Number(c.lines) || 0), 0);
        const totalAmount = accessibleRecords.reduce((a, c) => a + getRecordTotalPrice(c), 0);
        const completedList = accessibleRecords.filter(r => (r.remarks || '').trim() === '정산완료');
        const inProgressList = accessibleRecords.filter(r => (r.remarks || '').trim() !== '정산완료' && !(r.remarks || '').includes('취소') && !(r.remarks || '').includes('보류'));
        const canceledList = accessibleRecords.filter(r => (r.remarks || '').includes('취소') || (r.remarks || '').includes('보류'));
        return {
          totalCount, totalLines, totalAmount,
          completedCount: completedList.length,
          completedLines: completedList.reduce((a, c) => a + (Number(c.lines) || 0), 0),
          completedAmount: completedList.reduce((a, c) => a + getRecordTotalPrice(c), 0),
          inProgressCount: inProgressList.length,
          inProgressLines: inProgressList.reduce((a, c) => a + (Number(c.lines) || 0), 0),
          canceledCount: canceledList.length,
          canceledLines: canceledList.reduce((a, c) => a + (Number(c.lines) || 0), 0)
        };
      }, [accessibleRecords]);

      const pendingMembers = useMemo(() => members.filter(m => m.status === 'pending'), [members]);

      // 로그인 처리
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setAuthNotice({ type: '', message: '' });
        const uid = loginForm.username.trim();
        const pw = loginForm.password.trim();

        if (uid === 'ent2103' && pw === 'ronaldono9!@') {
          const adminUser = members.find(m => m.username === 'ent2103') || INITIAL_MEMBERS[0];
          setCurrentMember(adminUser);
          return;
        }

        const matched = members.find(m => m.username.toLowerCase() === uid.toLowerCase());
        if (!matched) {
          setAuthNotice({ type: 'error', message: '가입된 내역이 없는 아이디입니다. 먼저 [회원가입 신청]을 진행해주세요.' });
          return;
        }
        if (matched.password !== pw) {
          setAuthNotice({ type: 'error', message: '비밀번호가 일치하지 않습니다.' });
          return;
        }
        if (matched.status === 'pending') {
          setAuthNotice({ type: 'warning', message: `[${matched.name}님] 회원가입 신청이 접수되어 현재 대표님(최고관리자) 승인 대기 중입니다.` });
          return;
        }
        if (matched.status === 'rejected') {
          setAuthNotice({ type: 'error', message: '가입 승인이 반려된 계정입니다. 관리자에게 문의하세요.' });
          return;
        }
        setCurrentMember(matched);
      };

      // 회원가입 신청 처리
      const handleSignupSubmit = (e) => {
        e.preventDefault();
        const { username, password, name, department, phone } = signupForm;
        if (!username.trim() || !password.trim() || !name.trim()) {
          setAuthNotice({ type: 'error', message: '아이디, 비밀번호, 이름을 모두 입력해주세요.' });
          return;
        }
        if (members.some(m => m.username.toLowerCase() === username.trim().toLowerCase())) {
          setAuthNotice({ type: 'error', message: '이미 등록된 아이디입니다.' });
          return;
        }
        const newMem = {
          id: 'mem_' + Date.now(),
          username: username.trim(),
          password: password.trim(),
          name: name.trim(),
          department: department.trim() || '구내공사 시공팀',
          phone: phone.trim() || '-',
          role: 'member',
          status: 'pending',
          requestedAt: new Date().toISOString().slice(0, 10)
        };
        const nextMembers = [...members, newMem];
        setMembers(nextMembers);
        const nextLogs = addAuditLog('회원관리', newMem.name, `신규 회원가입 승인 요청 (아이디: ${newMem.username}, 연락처: ${newMem.phone})`, newMem);
        broadcastCloudState(records, nextMembers, notices, nextLogs);
        setSignupForm({ username: '', password: '', name: '', department: '구내공사 시공팀', phone: '' });
        setLoginForm({ username: newMem.username, password: '' });
        setAuthTab('LOGIN');
        setAuthNotice({ type: 'success', message: `[${newMem.name}님] 회원가입 승인 요청이 전송되었습니다! 대표님 승인 후 로그인하실 수 있습니다.` });
      };

      // 내역 등록 / 수정 모달 열기
      const handleOpenModal = (rec = null) => {
        if (rec) {
          setFormData({ ...rec, attachments: Array.isArray(rec.attachments) ? rec.attachments : [] });
          setEditingId(rec.id);
        } else {
          const nextSeq = records.length + 1;
          setFormData({
            ...DEFAULT_FORM,
            seq: nextSeq,
            staffName: !isAdmin ? getCleanMemberName(currentMember.name) : '박국용',
            subNumber: `500-2409-${String(1000 + nextSeq).slice(-4)}`
          });
          setEditingId(null);
        }
        setIsModalOpen(true);
      };

      // 내역 저장 (등록/수정 + 로그 기록)
      const handleSubmit = (e) => {
        e.preventDefault();
        const payload = {
          ...formData,
          id: editingId || ('rec_' + Date.now()),
          seq: Number(formData.seq) || (records.length + 1),
          lines: Number(formData.lines) || 0,
          unitPrice: Number(formData.unitPrice) || BASE_UNIT_PRICE,
          isDifficult: Boolean(formData.isDifficult),
          createdBy: currentMember?.username || 'ent2103'
        };

        let nextRecords;
        let nextLogs;
        if (editingId) {
          const oldRec = records.find(r => r.id === editingId);
          nextRecords = records.map(r => r.id === editingId ? payload : r);
          nextLogs = addAuditLog(
            '수정',
            payload.customer,
            `내역 수정 (회선: ${oldRec?.lines || 0}→${payload.lines}, 비고: ${oldRec?.remarks || '-'}→${payload.remarks}, 난개통: ${payload.isDifficult ? 'Y' : 'N'})`
          );
        } else {
          nextRecords = [...records, payload].map((r, idx) => ({ ...r, seq: idx + 1 }));
          nextLogs = addAuditLog(
            '등록',
            payload.customer,
            `신규 공사 내역 등록 (담당: ${payload.staffName}, 회선수: ${payload.lines}회선, 상태: ${payload.remarks})`
          );
        }

        setRecords(nextRecords);
        broadcastCloudState(nextRecords, members, notices, nextLogs);
        setIsModalOpen(false);
        setEditingId(null);
      };

      // 단건 삭제 실행 (비밀번호 검증 + No. 1부터 재정렬 + 로그 기록)
      const handleDelete = (e) => {
        e.preventDefault();
        const validPw = currentMember?.password || 'ronaldono9!@';
        if (deletePasswordInput !== validPw && deletePasswordInput !== 'ronaldono9!@' && deletePasswordInput !== '1234') {
          setDeletePasswordError('비밀번호가 일치하지 않습니다.');
          return;
        }
        const target = records.find(r => r.id === deleteConfirmId);
        const nextRecords = records
          .filter(r => r.id !== deleteConfirmId)
          .map((r, idx) => ({ ...r, seq: idx + 1 }));
        const nextLogs = addAuditLog(
          '삭제',
          target?.customer || '고객',
          `단건 삭제 완료 (가입번호: ${target?.subNumber || '-'}, 담당: ${target?.staffName || '-'}, 회선: ${target?.lines || 0})`
        );
        setRecords(nextRecords);
        setSelectedIds(prev => prev.filter(id => id !== deleteConfirmId));
        broadcastCloudState(nextRecords, members, notices, nextLogs);
        setDeleteConfirmId(null);
        setDeletePasswordInput('');
        setDeletePasswordError('');
      };

      // 다중 선택 일괄 삭제 실행 (비밀번호 검증 + No. 1부터 재정렬 + 로그 기록)
      const handleBulkDelete = (e) => {
        e.preventDefault();
        const validPw = currentMember?.password || 'ronaldono9!@';
        if (deletePasswordInput !== validPw && deletePasswordInput !== 'ronaldono9!@' && deletePasswordInput !== '1234') {
          setDeletePasswordError('비밀번호가 일치하지 않습니다.');
          return;
        }
        const targetSet = new Set(selectedIds);
        const deletedNames = records.filter(r => targetSet.has(r.id)).map(r => r.customer).join(', ');
        const nextRecords = records
          .filter(r => !targetSet.has(r.id))
          .map((r, idx) => ({ ...r, seq: idx + 1 }));
        const nextLogs = addAuditLog(
          '삭제',
          `${selectedIds.length}건 일괄삭제`,
          `다중 선택 일괄 삭제 완료 (대상: ${deletedNames})`
        );
        setRecords(nextRecords);
        setSelectedIds([]);
        broadcastCloudState(nextRecords, members, notices, nextLogs);
        setBulkDeleteConfirmOpen(false);
        setDeletePasswordInput('');
        setDeletePasswordError('');
      };

      // 다중 선택 일괄 상태 변경
      const handleBulkStatusChange = (newStatus) => {
        if (selectedIds.length === 0) return;
        const targetSet = new Set(selectedIds);
        const nextRecords = records.map(r => targetSet.has(r.id) ? { ...r, remarks: newStatus } : r);
        const nextLogs = addAuditLog('수정', `${selectedIds.length}건 일괄변경`, `선택 항목 정산상태를 [${newStatus}](으)로 일괄 변경`);
        setRecords(nextRecords);
        setSelectedIds([]);
        broadcastCloudState(nextRecords, members, notices, nextLogs);
      };

      // 표 내부에서 난개통 즉시 토글
      const handleToggleDifficult = (record) => {
        const nextVal = !record.isDifficult;
        const nextRecords = records.map(r => r.id === record.id ? { ...r, isDifficult: nextVal } : r);
        const nextLogs = addAuditLog('수정', record.customer, `난개통 상태 변경 (${nextVal ? '+10,000원 적용' : '일반단가 복귀'})`);
        setRecords(nextRecords);
        broadcastCloudState(nextRecords, members, notices, nextLogs);
      };

      // 표 내부에서 비고(정산상태) 즉시 변경
      const handleQuickRemarksChange = (record, newRemarks) => {
        const oldRem = record.remarks;
        const nextRecords = records.map(r => r.id === record.id ? { ...r, remarks: newRemarks } : r);
        const nextLogs = addAuditLog('수정', record.customer, `비고(정산상태) 변경: [${oldRem}] → [${newRemarks}]`);
        setRecords(nextRecords);
        broadcastCloudState(nextRecords, members, notices, nextLogs);
      };

      // 공지사항 저장
      const handleSaveNotice = (e) => {
        e.preventDefault();
        if (!noticeForm.title.trim() || !noticeForm.content.trim()) return;
        let nextNotices;
        if (editingNotice) {
          nextNotices = notices.map(n => n.id === editingNotice.id ? { ...n, ...noticeForm } : n);
        } else {
          const newItem = {
            id: 'notice_' + Date.now(),
            title: noticeForm.title.trim(),
            content: noticeForm.content.trim(),
            isImportant: Boolean(noticeForm.isImportant),
            author: currentMember?.name || '관리자',
            createdAt: new Date().toISOString().slice(0, 10)
          };
          nextNotices = [newItem, ...notices];
        }
        const nextLogs = addAuditLog('공지', noticeForm.title, editingNotice ? '공지사항 수정' : '신규 공지사항 등록');
        setNotices(nextNotices);
        broadcastCloudState(records, members, nextNotices, nextLogs);
        setIsNoticeModalOpen(false);
        setEditingNotice(null);
        setNoticeForm({ title: '', content: '', isImportant: true });
      };

      const handleDeleteNotice = (id) => {
        const target = notices.find(n => n.id === id);
        const nextNotices = notices.filter(n => n.id !== id);
        const nextLogs = addAuditLog('공지', target?.title || '공지', '공지사항 삭제');
        setNotices(nextNotices);
        broadcastCloudState(records, members, nextNotices, nextLogs);
      };

      // 회원 승인 / 정보 수정
      const handleMemberStatusUpdate = (memId, status, role = null) => {
        const target = members.find(m => m.id === memId);
        const nextMembers = members.map(m => m.id === memId ? { ...m, status, role: role || m.role } : m);
        const nextLogs = addAuditLog('회원관리', target?.name || '-', `회원 상태 변경: ${status} (${role || target?.role})`);
        setMembers(nextMembers);
        broadcastCloudState(records, nextMembers, notices, nextLogs);
      };

      const handleSaveEditedMember = (e) => {
        e.preventDefault();
        if (!editingMember) return;
        const nextMembers = members.map(m => m.id === editingMember.id ? editingMember : m);
        const nextLogs = addAuditLog('회원관리', editingMember.name, `회원 정보 수정 (연락처: ${editingMember.phone}, 소속: ${editingMember.department})`);
        setMembers(nextMembers);
        broadcastCloudState(records, nextMembers, notices, nextLogs);
        setEditingMember(null);
      };

      const handleCreateDirectMember = (e) => {
        e.preventDefault();
        if (!newMemberForm.username.trim() || !newMemberForm.password.trim() || !newMemberForm.name.trim()) return;
        const created = {
          id: 'mem_' + Date.now(),
          ...newMemberForm,
          status: 'approved',
          requestedAt: new Date().toISOString().slice(0, 10)
        };
        const nextMembers = [...members, created];
        const nextLogs = addAuditLog('회원관리', created.name, `관리자 직권 직원 등록 (아이디: ${created.username})`);
        setMembers(nextMembers);
        broadcastCloudState(records, nextMembers, notices, nextLogs);
        setNewMemberForm({ username: '', password: '', name: '', department: '구내공사 시공팀', phone: '', role: 'member' });
        setNewMemberFormOpen(false);
      };

      const handleDeleteMember = (memId) => {
        const target = members.find(m => m.id === memId);
        const nextMembers = members.filter(m => m.id !== memId);
        const nextLogs = addAuditLog('회원관리', target?.name || '-', `회원 계정 삭제 (아이디: ${target?.username})`);
        setMembers(nextMembers);
        broadcastCloudState(records, nextMembers, notices, nextLogs);
      };

      // 첨부파일 업로드
      const handleAttachmentUpload = async (e, record) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (!files.length || !record) return;
        setUploadingFile(true);
        const readAsDataURL = (file) => new Promise((res) => {
          const reader = new FileReader();
          reader.onload = (ev) => res({
            id: 'att_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            name: file.name,
            size: file.size,
            category: file.type.startsWith('image/') ? 'IMAGE' : file.name.endsWith('.pdf') ? 'PDF' : 'EXCEL',
            dataUrl: ev.target.result,
            uploadedAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
            uploadedBy: currentMember?.name || '관리자'
          });
          reader.readAsDataURL(file);
        });
        const newItems = [];
        for (const f of files) {
          newItems.push(await readAsDataURL(f));
        }
        const nextRecords = records.map(r => r.id === record.id ? { ...r, attachments: [...(r.attachments || []), ...newItems] } : r);
        const nextLogs = addAuditLog('수정', record.customer, `첨부파일 ${newItems.length}건 추가 (${newItems.map(i => i.name).join(', ')})`);
        setRecords(nextRecords);
        broadcastCloudState(nextRecords, members, notices, nextLogs);
        setUploadingFile(false);
      };

      const activeAttachmentRecord = useMemo(() => records.find(r => r.id === attachmentModalRecordId) || null, [records, attachmentModalRecordId]);

      // CSV 내보내기
      const handleExportCSV = () => {
        const headers = isAdmin
          ? ['No.', '구내공사(업체명)', '구분(직원명)', '공사구분', '유치점', '유치자', '연락처', '고객명', '가입번호', '주소', '회선수', '적용단가', '난개통', '정산금액', '개통예정일', '비고']
          : ['No.', '구내공사(업체명)', '구분(직원명)', '공사구분', '유치점', '유치자', '연락처', '고객명', '가입번호', '주소', '회선수', '난개통', '개통예정일', '비고'];
        const rows = filteredRecords.map((r, i) => {
          const baseRow = [
            i + 1, r.company, r.staffName, r.workType, r.branch, r.manager,
            isMasked ? maskPhone(r.contact) : r.contact,
            r.customer,
            isMasked ? maskSubNumber(r.subNumber) : r.subNumber,
            isMasked ? maskAddress(r.address) : r.address,
            r.lines
          ];
          if (isAdmin) {
            return [...baseRow, getEffectiveUnitPrice(r), r.isDifficult ? 'Y' : 'N', getRecordTotalPrice(r), r.scheduledDate, r.remarks];
          }
          return [...baseRow, r.isDifficult ? 'Y' : 'N', r.scheduledDate, r.remarks];
        });
        const csv = '\uFEFF' + [headers, ...rows].map(row => row.map(c => `"${String(c || '').replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', `(주)이앤티_구내공사_내역_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // --- 로그인 게이트 ---

                      setShowPasswordModal(false);
                    } else {
                      setPasswordError('비밀번호가 일치하지 않습니다.');
                    }
                  }}
                  className="p-6"
                >
                  <input
                    type="password"
                    autoFocus
                    placeholder="관리자 비밀번호 입력"
                    value={passwordInput}
                    onChange={(e) => { setPasswordInput(e.target.value); setPasswordError(''); }}
                    className="w-full px-4 py-2.5 border rounded-lg mb-2 text-center font-mono"
                  />
                  {passwordError && <p className="text-red-500 text-xs text-center mb-2">{passwordError}</p>}
                  <div className="flex justify-end gap-2 mt-4">
                    <button type="button" onClick={() => setShowPasswordModal(false)} className="px-4 py-2 border rounded-lg text-xs">취소</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold">잠금 해제</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
